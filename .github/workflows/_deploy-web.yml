name: Deploy web (reusable)

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      wrangler_env:
        required: true
        type: string
      url:
        required: false
        type: string
      worker_name:
        required: false
        type: string
        description: Override the worker name (for per-PR preview deployments)
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true
      JWT_SECRET:
        required: true
      STRIPE_SECRET_KEY:
        required: true
      STRIPE_WEBHOOK_SECRET:
        required: true
      RESEND_API_KEY:
        required: true
      TURSO_AUTH_TOKEN:
        required: true
permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.wrangler_env }}-${{ inputs.worker_name }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: ${{ inputs.environment }}
      url: ${{ inputs.url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare-env
      - name: Build
        working-directory: apps/web
        env:
          NEXT_PUBLIC_BETTER_STACK_SOURCE_TOKEN: ${{ vars.NEXT_PUBLIC_BETTER_STACK_SOURCE_TOKEN }}
          NEXT_PUBLIC_BETTER_STACK_INGESTING_URL: ${{ vars.NEXT_PUBLIC_BETTER_STACK_INGESTING_URL }}
          NEXT_PUBLIC_BETTER_STACK_TRACKING_TOKEN: ${{ vars.NEXT_PUBLIC_BETTER_STACK_TRACKING_TOKEN }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_GOOGLE_ANALYTICS_ID: ${{ vars.NEXT_PUBLIC_GOOGLE_ANALYTICS_ID }}
          NEXT_PUBLIC_STORAGE_KEY: ${{ vars.NEXT_PUBLIC_STORAGE_KEY }}
        run: pnpm run cf:build
      - name: Collect the Worker secrets
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          SECRETS_FILE: ${{ runner.temp }}/worker-secrets.json
        run: |
          node -e "
          const required = ['JWT_SECRET','STRIPE_SECRET_KEY','STRIPE_WEBHOOK_SECRET','RESEND_API_KEY','TURSO_AUTH_TOKEN'];
          const missing = required.filter(k => !process.env[k]);
          if (missing.length) { console.error('Missing required secrets: ' + missing.join(', ')); process.exit(1); }
          const body = JSON.stringify(Object.fromEntries(required.map(k => [k, process.env[k]])));
          require('node:fs').writeFileSync(process.env.SECRETS_FILE, body, { mode: 0o600 });
          "
      - name: Deploy to Cloudflare Workers
        working-directory: apps/web
        env:
          INPUTS_WORKER_NAME: ${{ inputs.worker_name }}
          INPUTS_WRANGLER_ENV: ${{ inputs.wrangler_env }}
          INPUTS_URL: ${{ inputs.url }}
          DEPLOY_MESSAGE: ${{ github.sha }}-${{ github.event_name }}
          SECRETS_FILE: ${{ runner.temp }}/worker-secrets.json
        run: |
          NAME_FLAG=""
          if [ -n "${INPUTS_WORKER_NAME}" ]; then
            NAME_FLAG="--name ${INPUTS_WORKER_NAME}"
          fi
          VAR_FLAG=""
          if [ -n "${INPUTS_URL}" ]; then
            VAR_FLAG="--var NEXT_PUBLIC_SITE_URL:${INPUTS_URL}"
          fi
          pnpm exec wrangler deploy --env "${INPUTS_WRANGLER_ENV}" --message "$DEPLOY_MESSAGE" --secrets-file "$SECRETS_FILE" $NAME_FLAG $VAR_FLAG
      - name: Remove the secrets file
        if: always()
        env:
          SECRETS_FILE: ${{ runner.temp }}/worker-secrets.json
        run: rm -f "$SECRETS_FILE"
