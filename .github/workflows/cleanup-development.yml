name: Cleanup - Development

on:
  pull_request:
    types: [closed]

permissions:
  contents: read

# Each job queues behind the workflow that deploys the Worker it deletes: ci.yml
# for the web preview, docs.yml for the docs preview. Each group is that
# workflow's `${{ github.workflow }}-${{ github.ref }}` with the name substituted
# in, so renaming either silently stops its wait. Full reasoning in the repo guide.
jobs:
  cleanup-web:
    name: Delete the web preview Worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: CI-${{ github.ref }}
      cancel-in-progress: false
    environment: web-development
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare-env
      - name: Delete preview Worker
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        env:
          WORKER_NAME: pr-${{ github.event.pull_request.number }}-forever-pto-development
        with:
          timeout_minutes: 2
          max_attempts: 5
          retry_wait_seconds: 10
          shell: bash
          command: |
            cd "$GITHUB_WORKSPACE/apps/web"
            output=$(pnpm exec wrangler delete "$WORKER_NAME" --force 2>&1) && { echo "$output"; exit 0; }
            echo "$output"
            echo "$output" | grep -qi "does not exist" && exit 0
            exit 1

  cleanup-docs:
    name: Delete the docs preview Worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: docs-${{ github.ref }}
      cancel-in-progress: false
    environment: docs-development
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare-env
      - name: Delete preview Worker
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        env:
          WORKER_NAME: pr-${{ github.event.pull_request.number }}-forever-pto-docs-development
        with:
          timeout_minutes: 2
          max_attempts: 5
          retry_wait_seconds: 10
          shell: bash
          command: |
            cd "$GITHUB_WORKSPACE/apps/docs"
            output=$(pnpm exec wrangler delete "$WORKER_NAME" --force 2>&1) && { echo "$output"; exit 0; }
            echo "$output"
            echo "$output" | grep -qi "does not exist" && exit 0
            exit 1
