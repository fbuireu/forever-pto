name: Docs

on:
  pull_request:
    paths:
      - 'apps/docs/**'
      - 'apps/web/package.json'
      - 'apps/web/src/ui/**'
      - 'apps/web/src/domain/calendar/types.ts'
      - 'apps/web/src/infrastructure/i18n/locales.ts'
      - 'pnpm-lock.yaml'
      - '.github/workflows/docs.yml'
      - '.github/actions/prepare-env/**'
  push:
    branches: [main]
    paths:
      - 'apps/docs/**'
      - 'apps/web/package.json'
      - 'apps/web/src/ui/**'
      - 'apps/web/src/domain/calendar/types.ts'
      - 'apps/web/src/infrastructure/i18n/locales.ts'
      - 'pnpm-lock.yaml'
      - '.github/workflows/docs.yml'
      - '.github/actions/prepare-env/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare-env
      - name: Typecheck
        run: pnpm --filter forever-pto-docs typecheck
      - name: Build
        run: pnpm --filter forever-pto-docs build
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter forever-pto-docs exec playwright install --with-deps chromium
      - name: Install Playwright OS dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter forever-pto-docs exec playwright install-deps chromium
      - name: Run E2E tests
        run: pnpm --filter forever-pto-docs test:e2e
      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-playwright-report
          path: apps/docs/playwright-report/
          retention-days: 7
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-dist
          path: apps/docs/dist/
          retention-days: 1

  preview:
    name: Preview
    if: github.event_name == 'pull_request'
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: docs-development
    permissions:
      contents: read
      pull-requests: write
    env:
      PREVIEW_MARKER: '<!-- docs-preview -->'
      PREVIEW_URL: https://pr-${{ github.event.pull_request.number }}-forever-pto-docs-development.fbuireu.workers.dev
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docs-dist
          path: apps/docs/dist
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/docs
          wranglerVersion: '4.121.0'
          command: deploy --env development --name pr-${{ github.event.pull_request.number }}-forever-pto-docs-development
      - name: Find existing comment
        uses: peter-evans/find-comment@b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad # v4.0.0
        id: find-comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: github-actions[bot]
          body-includes: ${{ env.PREVIEW_MARKER }}
      - name: Upsert preview comment
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          edit-mode: replace
          body: |
            ${{ env.PREVIEW_MARKER }}
            ### Docs preview

            | | |
            |---|---|
            | **URL** | ${{ env.PREVIEW_URL }} |
            | **Branch** | `${{ github.head_ref }}` |
            | **Commit** | `${{ github.event.pull_request.head.sha }}` |

  deploy:
    name: Deploy
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: docs-production
      url: https://docs.forever-pto.com
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docs-dist
          path: apps/docs/dist
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/docs
          wranglerVersion: '4.121.0'
          command: deploy --env production

  smoke:
    name: Docs production smoke tests
    needs: [deploy]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE_URL: https://docs.forever-pto.com
    steps:
      - name: Require the production URL
        run: |
          if [ -z "$BASE_URL" ]; then
            echo "The docs production URL is empty, so Playwright would fall back to localhost and pass against it"
            exit 1
          fi
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare-env
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter forever-pto-docs exec playwright install --with-deps chromium
      - name: Install Playwright OS dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter forever-pto-docs exec playwright install-deps chromium
      - name: Label the smoke report
        if: ${{ !cancelled() }}
        run: |
          {
            echo "## Docs production smoke tests"
            echo
            echo "Playwright ran the \`@smoke\` case against <$BASE_URL> after deploying \`$GITHUB_SHA\`."
            echo "The Playwright Run Summary annotation on this run belongs to this job, not to the docs suite the build job runs against a local preview."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Run smoke tests against production
        working-directory: apps/docs
        run: pnpm exec playwright test --grep "@smoke"
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-playwright-smoke-report
          path: apps/docs/playwright-report/
          retention-days: 7

  rollback:
    name: Roll back the docs site
    needs: [deploy, smoke]
    if: ${{ always() && needs.deploy.result == 'success' && needs.smoke.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: docs-production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ROLLBACK_MESSAGE: Smoke tests failed on ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare-env
      - name: Roll back to the previous version
        working-directory: apps/docs
        run: pnpm exec wrangler rollback --env production --yes --message "$ROLLBACK_MESSAGE"

  release-docs:
    name: Semantic Release (docs)
    if: github.event_name == 'push'
    needs: [deploy, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      issues: write
      pull-requests: write
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT }}
          persist-credentials: false
      - uses: ./.github/actions/prepare-env
      - name: Semantic Release
        working-directory: apps/docs
        env:
          GITHUB_TOKEN: ${{ secrets.PAT }}
        run: pnpm exec semantic-release
