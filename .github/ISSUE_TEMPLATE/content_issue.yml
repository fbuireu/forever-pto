name: Content Issue
description: Report a typo, a wrong translation, a broken link or a mistake in the planner's copy or the docs site
title: '[Content]: '
labels: ['content', 'triage']
assignees: ['fbuireu']
body:
  - type: markdown
    attributes:
      value: |
        The planner's copy lives in the locale bundles under `apps/web/src/ui/i18n/messages`, one file per language, and the docs site's pages under `apps/docs/src/content/docs`, so a mistake in either can be fixed by a pull request. Report it here if you would rather not open one, and say which language it is in.
  - type: input
    id: url
    attributes:
      label: Location
      description: The page URL, or where the text appears
      placeholder: https://forever-pto.com/... or https://docs.forever-pto.com/...
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: What it says now
      description: Quote the text with the problem
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: What it should say
      description: Your suggested correction, if you have one
  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Anything else that helps locate or understand the issue
